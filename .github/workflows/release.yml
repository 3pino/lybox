name: Release

# Push a tag like v0.1.0 to build a signed arm64 APK and attach it to a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          make androidsdk
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"

      - name: Decode keystore
        env:
          LYBOX_KEYSTORE_BASE64: ${{ secrets.LYBOX_KEYSTORE_BASE64 }}
        run: |
          echo "$LYBOX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lybox.jks"
          echo "LYBOX_KEYSTORE=$RUNNER_TEMP/lybox.jks" >> "$GITHUB_ENV"
          echo "LYBOX_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          LYBOX_KEYSTORE_PASSWORD: ${{ secrets.LYBOX_KEYSTORE_PASSWORD }}
          LYBOX_KEY_ALIAS: ${{ secrets.LYBOX_KEY_ALIAS }}
          LYBOX_KEY_PASSWORD: ${{ secrets.LYBOX_KEY_PASSWORD }}
        run: make lybox-release

      - name: Name the APK
        run: mv lybox-release.apk "lybox-${GITHUB_REF_NAME}-arm64.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lybox-*.apk
          generate_release_notes: true
